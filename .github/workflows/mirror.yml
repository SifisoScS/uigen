name: Mirror to second-intelligence

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror bare clone to second-intelligence
        env:
          SI_TOKEN: ${{ secrets.SI_MIRROR_TOKEN }}
        run: |
          git clone --bare https://github.com/KilimanjaroCode/uigen.git repo.git
          cd repo.git
          git push --mirror https://x-access-token:${SI_TOKEN}@github.com/second-intelligence/uigen.git
